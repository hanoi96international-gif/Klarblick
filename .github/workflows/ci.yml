name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Ein laufender Durchlauf pro Branch reicht — ältere abbrechen, sobald neu gepusht wird.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests und Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test --workspaces --if-present

      - name: Frontend bauen
        run: npm run build

      - name: Build-Ergebnis sichern
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  audit:
    name: Sicherheitsprüfung der Abhängigkeiten
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Bricht nur bei hohen und kritischen Lücken ab. Moderate Funde sollen den
      # Build nicht rot färben, aber im Log sichtbar bleiben.
      - name: npm audit
        run: npm audit --audit-level=high
